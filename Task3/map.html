<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 3 - Parking Map</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="wrap">
    <h1>Parking Lot Selector</h1>

    <div class="card">
      <section class="legend">
        <span class="chip available">Available</span>
        <span class="chip occupied">Occupied</span>
        <span class="chip selected">Selected</span>
      </section>

      <section class="summary" id="summary"></section>
      <p class="error" id="errorMsg"></p>

      <section class="map-grid" id="mapGrid"></section>
    </div>
  </main>

  <script src="./map.js"></script>
</body>

</html>
